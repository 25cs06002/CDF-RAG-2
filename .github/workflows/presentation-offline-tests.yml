name: Presentation Sprint Offline Tests

on:
  push:
    branches:
      - research-v2
    paths:
      - 'research_v2/presentation_*.py'
      - 'research_v2/preflight.py'
      - 'tests/test_presentation_*.py'
      - '.github/workflows/presentation-offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sprint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic==2.11.4' 'python-dotenv==1.1.0' 'requests==2.32.3'
      - name: Compile all presentation source and tests
        run: |
          python -m compileall -q research_v2/presentation_sprint.py research_v2/presentation_baselines.py research_v2/presentation_matrix.py research_v2/presentation_g0_reference.py tests/test_presentation_sprint.py tests/test_presentation_baselines.py tests/test_presentation_matrix.py
      - name: Execute isolated tests (no Ollama, Neo4j or PPO)
        run: |
          python -m unittest tests.test_presentation_sprint tests.test_presentation_baselines tests.test_presentation_matrix -v
