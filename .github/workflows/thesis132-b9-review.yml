name: Thesis132 B9 AI Review Handoff
on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_b9_review.py'
      - 'review_b9_132.py'
      - 'tests/test_thesis132_b9_review_local.py'
      - '.github/workflows/thesis132-b9-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2,<3' requests python-dotenv
      - run: python -m unittest discover -s tests -p 'test_thesis132_b9_review_local.py' -v
      - run: python review_b9_132.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: B9-v2-external-review-package
          path: presentation_20261118/thesis132/b9_end_to_end_v2/b9_v2_adaptive_20261125T182727462347Z_c92418/ai_review_package_*.zip
          retention-days: 14
