name: Thesis132 Experimental Foundation

on:
  push:
    branches:
      - mtp-thesis132
      - master
    paths:
      - "research_v2/thesis132*.py"
      - "tests/test_thesis132_local.py"
      - ".github/workflows/thesis132-foundation.yml"
      - "data/benchmark/v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight protocol test dependencies
        run: |
          python -m pip install --disable-pip-version-check "pydantic>=2,<3" requests python-dotenv
      - name: Compile candidate implementation and tests
        run: |
          python -m compileall -q research_v2/thesis132.py research_v2/thesis132_g1.py tests/test_thesis132_local.py
      - name: Run frozen 132 data, B1 smoke and guarded G1 tests
        run: |
          python -m unittest discover -s tests -p "test_thesis132_local.py" -v
      - name: Audit source-reviewed dataset remains non-gold
        run: |
          python -m research_v2.benchmark_v2_validation
          python -m research_v2.thesis132 freeze
      - name: Check no unexpected output or scoring claims
        run: |
          python - <<'PY'
          from research_v2.thesis132 import freeze
          import json
          out=freeze()
          meta=json.loads((out/"manifest.json").read_text())
          assert meta["questions"]==132
          assert meta["historical_g1_exposure"] is True
          assert meta["independent_clinical_gold"] is False
          print("PASS: 132 frozen and historical exposure disclosed")
          PY
