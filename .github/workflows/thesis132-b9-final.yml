name: Thesis132 B9 Final Evaluation Handoff
on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_b9_final.py'
      - 'final_b9_132.py'
      - 'tests/test_thesis132_b9_final_local.py'
      - '.github/workflows/thesis132-b9-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2,<3' requests python-dotenv
      - run: python -m unittest discover -s tests -p 'test_thesis132_b9_final_local.py' -v
      - run: python final_b9_132.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: B9-final-external-review
          path: presentation_20261118/thesis132/b9_final_evaluation_v2/review_package_*.zip
          retention-days: 14
