name: Thesis132 Final Experimental Release
on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_release.py'
      - 'export_final_thesis_132.py'
      - 'tests/test_thesis132_release_local.py'
      - '.github/workflows/thesis132-final-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2,<3' requests python-dotenv matplotlib
      - run: python -m unittest discover -s tests -p 'test_thesis132_release_local.py' -v
      - run: python export_final_thesis_132.py
      - uses: actions/upload-artifact@v4
        with:
          name: thesis132-final-experimental-results
          path: presentation_20261118/thesis132/final_thesis_results_132/release_*/
          retention-days: 30
