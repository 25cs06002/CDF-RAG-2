name: Thesis132 Final Dataset Integrity and Release ZIP

on:
  push:
    branches:
      - work/thesis132-g1-target-sufficiency
    paths:
      - "data/benchmark/final_132_v1/**"
      - "data/benchmark/v2/**"
      - "data/benchmark/medical_causal_pilot100_draft_v1.jsonl"
      - "data/benchmark/medical_causal_expansion32_draft_v1.jsonl"
      - "research_v2/thesis132_dataset_release.py"
      - "research_v2/thesis132.py"
      - "tests/test_thesis132_dataset_release_local.py"
      - ".github/workflows/thesis132-final-dataset.yml"
  pull_request:
    paths:
      - "data/benchmark/final_132_v1/**"
      - "data/benchmark/v2/**"
      - "research_v2/thesis132_dataset_release.py"
      - "research_v2/thesis132.py"
      - "tests/test_thesis132_dataset_release_local.py"
      - ".github/workflows/thesis132-final-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-132-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline benchmark prerequisites
        run: |
          python -m pip install --disable-pip-version-check "pydantic>=2,<3" requests python-dotenv
      - name: Syntax and schema validation
        run: |
          python -m compileall -q research_v2/thesis132.py research_v2/thesis132_dataset_release.py tests/test_thesis132_dataset_release_local.py
          python -m research_v2.benchmark_v2_validation
          python -m research_v2.thesis132_dataset_release
      - name: Fail-fast release and anti-leakage regression tests
        run: |
          python -m unittest discover -s tests -p 'test_thesis132_dataset_release_local.py' -v
          python -m unittest discover -s tests -p 'test_thesis132_local.py' -v
      - name: Ensure the original idempotent frozen 132 is identical
        run: |
          python -m research_v2.thesis132 freeze
          python - <<'PY'
          from pathlib import Path
          from research_v2.thesis132 import freeze
          from research_v2.thesis132_dataset_release import INPUT, verify_release
          release=verify_release()
          frozen=freeze()
          assert (frozen/"questions_only.jsonl").read_bytes()==INPUT.read_bytes()
          assert len((frozen/"fold_metadata.csv").read_text().splitlines())==133
          print("Exact byte equality: original frozen 132 == final tracked B1-B9 input")
          PY
      - name: Prepare EMPTY external review worksheet (not medical gold)
        run: |
          python -m research_v2.benchmark_v2_validation --prepare-review
      - name: Package exact verified dataset and source-screened annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path.cwd()
          release=root/"data/benchmark/final_132_v1"
          files=sorted(release.glob("*"))
          files += [root/p for p in [
              "data/benchmark/v2/manifest.json",
              "data/benchmark/v2/medical_causal_132_source_screened_v2.jsonl",
              "data/benchmark/v2/source_catalog_screened_20261121.json",
              "data/benchmark/medical_causal_pilot100_draft_v1.jsonl",
              "data/benchmark/medical_causal_expansion32_draft_v1.jsonl",
          ]]
          files += sorted((root/"presentation_20261118/benchmark_v2_audit").glob(
              "screening_*/independent_adjudication_worksheet.csv"))
          assert len(files)==len(set(files))
          assert len(files)==13, [(p.name, p.exists()) for p in files]
          out=root/"THESIS132_FINAL_QUERY_DATASET_V1_20261121.zip"
          with ZipFile(out,"w",ZIP_DEFLATED) as zipfile:
              for path in files:
                  assert path.is_file()
                  zipfile.write(path,path.relative_to(root))
          print(f"ZIP contains {len(files)} traceable files: {out}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: THESIS132_FINAL_QUERY_DATASET_V1
          path: THESIS132_FINAL_QUERY_DATASET_V1_20261121.zip
          if-no-files-found: error
          retention-days: 30
