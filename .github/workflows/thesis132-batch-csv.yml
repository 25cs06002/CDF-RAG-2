name: Thesis132 B1-B8 CSV Export Validation

on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_csv_export.py'
      - 'evaluate_batch_queries_132.py'
      - 'export_batch_metrics_132.py'
      - 'tests/test_thesis132_csv_export_local.py'
      - 'docs/THESIS132_B1_B8_CSV_EVALUATION.md'
      - '.github/workflows/thesis132-batch-csv.yml'
  pull_request:
    paths:
      - 'research_v2/thesis132_csv_export.py'
      - 'evaluate_batch_queries_132.py'
      - 'export_batch_metrics_132.py'
      - 'tests/test_thesis132_csv_export_local.py'
      - '.github/workflows/thesis132-batch-csv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic>=2,<3' requests python-dotenv
      - name: Syntax checks
        run: |
          python -m compileall -q evaluate_batch_queries_132.py export_batch_metrics_132.py research_v2/thesis132_csv_export.py tests/test_thesis132_csv_export_local.py
      - name: Verify 132 source question integrity
        run: python -m research_v2.thesis132_dataset_release
      - name: Synthetic 132 CSV schema and anti-tampering tests
        run: |
          python -m unittest discover -s tests -p 'test_thesis132_csv_export_local.py' -v
      - name: CLI help without triggering models
        run: |
          python evaluate_batch_queries_132.py --help
          python export_batch_metrics_132.py --help
