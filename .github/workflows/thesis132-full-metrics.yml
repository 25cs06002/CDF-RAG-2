name: Thesis132 Full Screenshot-Style 8-Model Metrics Validation
on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_full_metrics.py'
      - 'evaluate_all_metrics_132.py'
      - 'show_evaluation_132.py'
      - 'compare_all_models_132.py'
      - 'compare_hallucination_132.py'
      - 'prepare_hallucination_reviews_132.py'
      - 'tests/test_thesis132_full_metrics_local.py'
      - 'docs/THESIS132_FULL_METRICS_TERMINAL_GUIDE.md'
      - '.github/workflows/thesis132-full-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculate-from-real-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: |
          python -m compileall -q research_v2/thesis132_full_metrics.py evaluate_all_metrics_132.py show_evaluation_132.py compare_all_models_132.py compare_hallucination_132.py prepare_hallucination_reviews_132.py tests/test_thesis132_full_metrics_local.py
      - name: Full real 132 x 8 data validation and anti-gold fabrication tests
        run: python -m unittest discover -s tests -p 'test_thesis132_full_metrics_local.py' -v
      - name: Generate metrics from actual stored experiment, without model inference
        run: python evaluate_all_metrics_132.py
      - name: Validate terminal reports
        run: |
          BASE=presentation_20261118/thesis132/csv_reports/batch132_csv_20261121T061653054773Z_bfeb15
          REPORT=$(find "$BASE" -maxdepth 1 -mindepth 1 -type d -name 'full_metrics_132_*' | sort | tail -1)
          test -n "$REPORT"
          python show_evaluation_132.py --report-dir "$REPORT" --model B7
          python compare_all_models_132.py --report-dir "$REPORT"
          python compare_hallucination_132.py --report-dir "$REPORT" --model B8
      - uses: actions/upload-artifact@v4
        with:
          name: thesis132-full-8-model-metrics-no-gold
          path: presentation_20261118/thesis132/csv_reports/batch132_csv_20261121T061653054773Z_bfeb15/full_metrics_132_*/
          retention-days: 14
