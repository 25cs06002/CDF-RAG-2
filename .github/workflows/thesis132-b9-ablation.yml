name: Thesis132 B9 Policy Ablation
on:
  push:
    branches: [work/thesis132-g1-target-sufficiency]
    paths:
      - 'research_v2/thesis132_b9_ablation.py'
      - 'compare_b9_ablation_132.py'
      - 'tests/test_thesis132_b9_ablation_local.py'
      - '.github/workflows/thesis132-b9-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2,<3' requests python-dotenv
      - run: python -m unittest discover -s tests -p 'test_thesis132_b9_ablation_local.py' -v
