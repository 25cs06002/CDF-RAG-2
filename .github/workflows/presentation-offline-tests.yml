name: Presentation Sprint Offline Tests

on:
  push:
    branches:
      - research-v2
    paths:
      - 'research_v2/presentation_*.py'
      - 'research_v2/preflight.py'
      - 'tests/test_presentation_*.py'
      - 'tests/test_model_registry.py'
      - 'research_v2/pipelines/**'
      - '.github/workflows/presentation-offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sprint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic==2.11.4' 'python-dotenv==1.1.0' 'requests==2.32.3' 'scikit-learn==1.6.1'
      - name: Compile all presentation source and tests
        run: |
          python -m compileall -q research_v2/presentation_sprint.py research_v2/presentation_baselines.py research_v2/presentation_matrix.py research_v2/presentation_g0_reference.py research_v2/presentation_corpus.py research_v2/presentation_export.py tests/test_presentation_sprint.py tests/test_presentation_baselines.py tests/test_presentation_matrix.py tests/test_presentation_corpus.py tests/test_model_registry.py
      - name: Execute isolated tests (no Ollama, Neo4j or PPO)
        run: |
          python -m unittest tests.test_presentation_sprint tests.test_presentation_baselines tests.test_presentation_matrix tests.test_presentation_corpus tests.test_model_registry -v

      - name: Prepare frozen pilot and candidate source summaries
        run: |
          python -m research_v2.presentation_sprint prepare
          python -m research_v2.presentation_corpus prepare
          python -m research_v2.presentation_matrix validate
          python -m research_v2.presentation_g0_reference prepare
      - name: Verify preflight module is valid Python and references local G0
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("research_v2/preflight.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == "collect_runtime")
          matches = [n for n in ast.walk(fn) if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "graph_dir" for t in n.targets)]
          assert len(matches) == 1, "Preflight must initialize graph_dir once"
          assert "research_artifacts" in ast.unparse(matches[0].value)
          print("ARCHIVED G0 PATH CONFIGURATION VERIFIED")
          PY
      - name: Execute 100 queries through unified B1-B6 experiment matrix
        run: |
          python -m research_v2.presentation_matrix run \
            --models B1,B2,B3,B4,B5,B6 --encoder lsa --retrieval-only
      - name: Produce actual retrieval-only pilot summary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from research_v2.presentation_matrix import load_metadata, summarize
          from research_v2.schema import PipelineRecord
          root = Path("presentation_20261118")
          output = root / "metrics/offline_pilot"
          output.mkdir(parents=True, exist_ok=False)
          metadata = load_metadata()
          rows = []
          for path in sorted((root / "runs").glob("*/summary.json")):
              info = json.loads(path.read_text(encoding="utf-8"))
              records = [PipelineRecord.model_validate_json(line) for line in (path.parent / "records.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
              if len(records) != 100 or info["total_queries"] != 100:
                  raise ValueError("A run was not completed on 100 queries")
              result = summarize(records, metadata, info["wall_time_seconds"])
              row = {"pipeline": info["pipeline_id"], "run_id": info["run_id"],
                     "execution_mode": "retrieval_only",
                     "source_role": "candidate_summaries" if info["pipeline_id"] in ("naive_rag","bm25_rag","dense_rag","hybrid_rag") else "G0_snapshot",
                     **{key: value for key, value in result.items() if key != "by_category"}}
              rows.append(row)
          if len(rows) != 6:
              raise ValueError(f"Expected 6 baseline runs, got {len(rows)}")
          with (output / "summary.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          (output / "summary.json").write_text(json.dumps(rows, indent=2), encoding="utf-8")
          print(json.dumps(rows, indent=2))
          PY
      - name: Produce 100-query by eight-model comparison with explicit missing slots
        run: |
          python -m research_v2.presentation_export
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          reports = sorted(Path("presentation_20261118/metrics").glob("supervisor_matrix_*"))
          assert len(reports) == 1
          root = reports[0]
          with (root / "all_800_slots_long.csv").open(newline="", encoding="utf-8") as f:
              long = list(csv.DictReader(f))
          with (root / "model_summary_B1_B8.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(long) == 800 and len(rows) == 8
          detailed = [
              json.loads(line)
              for line in (root / "query_model_details.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(detailed) == 800
          assert sum(item["status"] == "NOT_RUN" for item in detailed) == 200
          assert all(len(item["document_ids"] or []) > 0 for item in detailed
                     if item["model_id"] in {"B1","B2","B3","B4"})
          assert all(item["final_answer"] is None for item in detailed)
          assert all(item["run_id"] is None for item in detailed
                     if item["model_id"] in {"B7","B8"})
          assert sum(r["status"] == "NOT_RUN" for r in long) == 200
          assert {r["model_id"] for r in rows if r["execution_status"] == "COMPLETE_100"} == {
              "B1", "B2", "B3", "B4", "B5", "B6"
          }
          print("Verified 600 measured slots and 200 clearly NOT_RUN slots")
          PY
      - name: Score G0 structural snapshot recovery (not clinical accuracy)
        run: |
          python -m research_v2.presentation_g0_reference score
          python - <<'PY'
          import json
          from pathlib import Path
          output = Path("presentation_20261118/metrics/g0_structural_pilot_v1/structural_scores.json")
          data = json.loads(output.read_text(encoding="utf-8"))
          assert data["models_scored"] == 6
          assert not any(row["medical_gold"] for row in data["results"])
          assert sum(r["structural_edge_score_applicable"] for r in data["results"]) == 2
          print("Structural-only scoring completed for B5 and B6; B1-B4 marked N/A")
          PY
      - name: Upload pilot measurements
        uses: actions/upload-artifact@v4
        with:
          name: pilot100-six-retrieval-only-with-lsa
          path: |
            presentation_20261118/benchmark/manifest.json
            presentation_20261118/corpus/provisional_source_summaries_v1/manifest.json
            presentation_20261118/metrics/offline_pilot/
            presentation_20261118/metrics/g0_structural_pilot_v1/
            presentation_20261118/metrics/supervisor_matrix_*/
            presentation_20261118/runs/
          retention-days: 7
